<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe4cc"/>
      <stop offset="100%" stop-color="#ffcfad"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8d8e8"/>
      <stop offset="100%" stop-color="#b8b8cc"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a30"/>
      <stop offset="100%" stop-color="#0e0e1e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- 腿（稍内八） -->
    <rect x="38" y="130" width="14" height="32" rx="5" fill="#12122a"/>
    <rect x="62" y="130" width="14" height="32" rx="5" fill="#12122a"/>
    <ellipse cx="45" cy="162" rx="9" ry="5" fill="#0a0a18"/>
    <ellipse cx="69" cy="162" rx="9" ry="5" fill="#0a0a18"/>
    <!-- 身体（塌肩） -->
    <path d="M36 94 Q36 84 42 82 L78 82 Q84 84 84 94 L84 132 Q84 138 78 138 L42 138 Q36 138 36 132 Z" fill="url(#coat)"/>
    <path d="M44 82 L54 98 L60 90 L66 98 L76 82" fill="none" stroke="#2a2a44" stroke-width="2"/>
    <circle cx="60" cy="108" r="7" fill="#cc2828"/>
    <circle cx="60" cy="108" r="4.5" fill="#dd4444"/>
    <circle cx="59" cy="107" r="2" fill="rgba(255,255,255,0.3)"/>
    <!-- 手臂下垂 -->
    <path d="M36 100 L24 118" fill="none" stroke="#1a1a30" stroke-width="6" stroke-linecap="round"/>
    <circle cx="24" cy="120" r="5" fill="url(#skin)"/>
    <path d="M84 100 L96 118" fill="none" stroke="#1a1a30" stroke-width="6" stroke-linecap="round"/>
    <circle cx="96" cy="120" r="5" fill="url(#skin)"/>
    <!-- 头（微低） -->
    <g transform="translate(0,4)">
      <circle cx="60" cy="54" r="36" fill="url(#skin)"/>
      <!-- 耳朵（下垂） -->
      <polygon points="28,34 16,14 40,26" fill="url(#hair)" stroke="#a0a0bc" stroke-width="1"/>
      <polygon points="30,32 22,18 38,28" fill="#e8a0a0"/>
      <polygon points="92,34 104,14 80,26" fill="url(#hair)" stroke="#a0a0bc" stroke-width="1"/>
      <polygon points="90,32 98,18 82,28" fill="#e8a0a0"/>
      <!-- 头发（更暗沉） -->
      <path d="M24 42 Q24 14 60 10 Q96 14 96 42 L96 32 Q96 8 60 4 Q24 8 24 32 Z" fill="url(#hair)"/>
      <path d="M22 44 Q20 28 30 18" fill="none" stroke="#c0c0d8" stroke-width="4" stroke-linecap="round"/>
      <path d="M98 44 Q100 28 90 18" fill="none" stroke="#c0c0d8" stroke-width="4" stroke-linecap="round"/>
      <path d="M36 30 Q42 38 48 28" fill="url(#hair)" stroke="#b0b0c8" stroke-width="1"/>
      <path d="M72 28 Q78 38 84 30" fill="url(#hair)" stroke="#b0b0c8" stroke-width="1"/>
      <path d="M46 26 Q54 34 62 26" fill="url(#hair)" stroke="#b0b0c8" stroke-width="1"/>
      <!-- 眼睛（下垂半闭） -->
      <path d="M36 56 Q44 50 52 56" fill="#1a44bb" stroke="#1a44bb" stroke-width="2"/>
      <path d="M68 56 Q76 50 84 56" fill="#1a44bb" stroke="#1a44bb" stroke-width="2"/>
      <path d="M36 56 Q44 54 52 56" fill="url(#skin)" opacity="0.7"/>
      <path d="M68 56 Q76 54 84 56" fill="url(#skin)" opacity="0.7"/>
      <circle cx="42" cy="55" r="1.5" fill="white" opacity="0.4"/>
      <circle cx="74" cy="55" r="1.5" fill="white" opacity="0.4"/>
      <!-- 眉毛（下垂） -->
      <path d="M36 44 Q44 48 52 46" fill="none" stroke="#9999bb" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M68 46 Q76 48 84 44" fill="none" stroke="#9999bb" stroke-width="2.2" stroke-linecap="round"/>
      <!-- 嘴（向下弯） -->
      <path d="M50 72 Q60 66 70 72" fill="none" stroke="#b06060" stroke-width="2.2" stroke-linecap="round"/>
      <!-- 腮红（淡） -->
      <ellipse cx="34" cy="64" rx="5" ry="3" fill="#ffaaaa" opacity="0.22"/>
      <ellipse cx="86" cy="64" rx="5" ry="3" fill="#ffaaaa" opacity="0.22"/>
      <!-- 汗滴/沮丧符号 -->
      <path d="M16 28 Q12 18 18 14 Q24 18 20 28 Z" fill="#88bbff" opacity="0.5"/>
    </g>
  </g>
</svg>