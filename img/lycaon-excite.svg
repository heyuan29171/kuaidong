<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe4cc"/>
      <stop offset="100%" stop-color="#ffcfad"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8f4"/>
      <stop offset="100%" stop-color="#c8c8dc"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a30"/>
      <stop offset="100%" stop-color="#0e0e1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- 腿 -->
    <rect x="38" y="130" width="14" height="32" rx="5" fill="#12122a"/>
    <rect x="62" y="130" width="14" height="32" rx="5" fill="#12122a"/>
    <ellipse cx="45" cy="162" rx="9" ry="5" fill="#0a0a18"/>
    <ellipse cx="69" cy="162" rx="9" ry="5" fill="#0a0a18"/>
    <!-- 身体（稍前倾） -->
    <path d="M36 92 Q36 82 42 80 L78 80 Q84 82 84 92 L84 132 Q84 138 78 138 L42 138 Q36 138 36 132 Z" fill="url(#coat)"/>
    <path d="M44 80 L54 96 L60 88 L66 96 L76 80" fill="none" stroke="#2a2a44" stroke-width="2"/>
    <circle cx="60" cy="106" r="7" fill="#e03030"/>
    <circle cx="60" cy="106" r="4.5" fill="#ff5544"/>
    <circle cx="59" cy="105" r="2" fill="rgba(255,255,255,0.4)"/>
    <!-- 手握拳在胸前 -->
    <path d="M36 100 L30 90 Q28 86 32 84 L38 88" fill="none" stroke="#1a1a30" stroke-width="5" stroke-linecap="round"/>
    <circle cx="32" cy="86" r="5" fill="url(#skin)"/>
    <path d="M84 100 L90 90 Q92 86 88 84 L82 88" fill="none" stroke="#1a1a30" stroke-width="5" stroke-linecap="round"/>
    <circle cx="88" cy="86" r="5" fill="url(#skin)"/>
    <!-- 头 -->
    <circle cx="60" cy="54" r="36" fill="url(#skin)"/>
    <circle cx="60" cy="54" r="36" fill="url(#glow)"/>
    <!-- 耳朵 -->
    <polygon points="28,30 20,6 42,22" fill="url(#hair)" stroke="#b0b0cc" stroke-width="1"/>
    <polygon points="30,28 24,12 40,24" fill="#f0a0a0"/>
    <polygon points="92,30 100,6 78,22" fill="url(#hair)" stroke="#b0b0cc" stroke-width="1"/>
    <polygon points="90,28 96,12 80,24" fill="#f0a0a0"/>
    <!-- 头发 -->
    <path d="M24 42 Q24 14 60 10 Q96 14 96 42 L96 32 Q96 8 60 4 Q24 8 24 32 Z" fill="url(#hair)"/>
    <path d="M22 44 Q20 28 30 18" fill="none" stroke="#d0d0e8" stroke-width="4" stroke-linecap="round"/>
    <path d="M98 44 Q100 28 90 18" fill="none" stroke="#d0d0e8" stroke-width="4" stroke-linecap="round"/>
    <path d="M36 30 Q42 38 48 28" fill="url(#hair)" stroke="#c0c0d8" stroke-width="1"/>
    <path d="M72 28 Q78 38 84 30" fill="url(#hair)" stroke="#c0c0d8" stroke-width="1"/>
    <path d="M46 26 Q54 34 62 26" fill="url(#hair)" stroke="#c0c0d8" stroke-width="1"/>
    <!-- 眼睛（睁大发光，期待） -->
    <ellipse cx="44" cy="54" rx="8" ry="10" fill="#2255dd"/>
    <ellipse cx="76" cy="54" rx="8" ry="10" fill="#2255dd"/>
    <ellipse cx="44" cy="54" rx="6" ry="8" fill="#4488ff"/>
    <ellipse cx="76" cy="54" rx="6" ry="8" fill="#4488ff"/>
    <circle cx="42" cy="50" r="3" fill="white" opacity="0.95"/>
    <circle cx="74" cy="50" r="3" fill="white" opacity="0.95"/>
    <circle cx="47" cy="56" r="1.5" fill="white" opacity="0.55"/>
    <circle cx="79" cy="56" r="1.5" fill="white" opacity="0.55"/>
    <!-- 光晕 -->
    <ellipse cx="44" cy="52" rx="4" ry="5" fill="white" opacity="0.12"/>
    <ellipse cx="76" cy="52" rx="4" ry="5" fill="white" opacity="0.12"/>
    <!-- 眉毛（高扬兴奋） -->
    <path d="M35 38 Q44 30 53 36" fill="none" stroke="#7777aa" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M67 36 Q76 30 85 38" fill="none" stroke="#7777aa" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 嘴（微张期待） -->
    <ellipse cx="60" cy="70" rx="7" ry="5" fill="#c05050" stroke="#a04040" stroke-width="1.2"/>
    <ellipse cx="60" cy="69" rx="5" ry="3" fill="#e88080" opacity="0.6"/>
    <!-- 腮红 -->
    <ellipse cx="33" cy="62" rx="6" ry="3.5" fill="#ffaaaa" opacity="0.4"/>
    <ellipse cx="87" cy="62" rx="6" ry="3.5" fill="#ffaaaa" opacity="0.4"/>
    <!-- 兴奋符号 -->
    <text x="14" y="46" font-size="12" fill="#ffd166" opacity="0.75">！</text>
    <text x="100" y="46" font-size="12" fill="#ffd166" opacity="0.75">！</text>
  </g>
</svg>